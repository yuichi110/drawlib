name: "Unit Tests"
run-name: mode=${{ inputs.mode || 'ubuntu-only' }}, python=${{ inputs.mode == 'full' && 'all' || inputs.python_version || '3.12' }}, branch=${{ inputs.branch || github.head_ref || github.ref_name }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test matrix scope'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'all-os'
          - 'ubuntu-only'

      python_version:
        description: 'Python version (ignored when mode is full)'
        required: true
        default: '3.12'
        type: choice
        options:
          - '3.11'
          - '3.12'
          - '3.13'

      branch:
        description: 'Branch override (leave empty to test the selected UI branch)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.mode == 'full' || inputs.mode == 'all-os') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
        python_version: ${{ inputs.mode == 'full' && fromJSON('["3.11", "3.12", "3.13"]') || fromJSON(format('["{0}"]', inputs.python_version || '3.12')) }}
    uses: ./.github/workflows/ut_template.yml
    with:
      os: "${{ matrix.os }}"
      python_version: "${{ matrix.python_version }}"
      install_from: 'github'
      branch: "${{ inputs.branch || '' }}"
      lib_version: 'latest'

