name: "ut from:pypi, os:all, python:all"
run-name: version=${{ inputs.lib_version || 'latest' }}, branch=${{ inputs.branch || 'release-tag' }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/tag override for test suite (leave empty to match release tag v<version>)'
        required: false
        default: ''
        type: string
      lib_version:
        description: 'Lib version on PyPI (e.g. latest or 0.3.6)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: read

jobs:
  matrix-test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python_version: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/ut_template.yml
    with:
      os: "${{ matrix.os }}"
      python_version: "${{ matrix.python_version }}"
      install_from: 'pypi'
      branch: "${{ inputs.branch || '' }}"
      lib_version: "${{ inputs.lib_version }}"
