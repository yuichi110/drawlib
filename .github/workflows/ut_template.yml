name: unit test template
run-name: version=${{ inputs.lib_version }}, from=${{ inputs.install_from }}, os=${{ inputs.os }}, python=${{ inputs.python_version }}, branch=${{ inputs.branch }}

on:
  workflow_call:
    inputs:
      os:
        description: 'OS'
        required: true
        default: 'ubuntu-latest'
        type: string

      python_version:
        description: 'Python version'
        required: true
        default: '3.12'
        type: string

      install_from:
        description: 'Where you get the lib'
        required: true
        default: 'github'
        type: string

      branch:
        description: 'Branch to run tests on'
        required: true
        default: 'main'
        type: string

      lib_version:
        description: 'Lib version. Ignored when you get it from github'
        required: true
        default: 'latest'
        type: string

jobs:
  unit-test:
    runs-on: ${{ inputs.os }}
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Display Inputs
      shell: bash
      run: |
        echo "Running on OS: ${{ inputs.os }}"
        echo "Python version: ${{ inputs.python_version }}"
        echo "Installing from: ${{ inputs.install_from }}"
        echo "Library version: ${{ inputs.lib_version }}"
        echo "Branch: ${{ inputs.branch }}"

    - name: Install dependencies and drawlib
      shell: bash
      run: |
        if [ "${{ inputs.install_from }}" == "github" ]; then
          echo "Syncing dependencies with uv..."
          uv sync

        elif [ "${{ inputs.install_from }}" == "pypi" ]; then
          echo "Resolving version..."
          if [ "${{ inputs.lib_version }}" == "latest" ]; then
            LIB_VER=$(python tools/scripts/pypi_tools.py --get_latest_version)
            echo "Latest version: $LIB_VER"
          else
            LIB_VER="${{ inputs.lib_version }}"
          fi

          # Rename src/ to prevent local import instead of installed package
          if [ -d "src" ]; then
            mv src _src_backup
          fi

          echo "Installing drawlib==$LIB_VER from PyPI via uv..."
          uv venv
          uv pip install "drawlib==$LIB_VER" pytest pytest-cov tomlkit

        else
          echo "install_from is not supported: ${{ inputs.install_from }}"
          exit 1
        fi

    - name: Run unit test
      shell: bash
      run: |
        if [ "${{ inputs.install_from }}" == "github" ]; then
          uv run pytest -s --cov=drawlib tests/
        else
          uv run pytest -s tests/
        fi

