id: repo_structure_audit
name: Repository Structure & Dependency Audit (Python)
description: Deterministically inspect Python build manifests, lockfiles, and documentation, then have AI evaluate against rules.
rules:
  - common/supply_chain
  - common/documentation
  - common/git_workflow
  - common/security
  - python/dependencies
primitives:
  - type: project_inspect
    name: Extract Repository, Supply-Chain & Dependency Facts
    with:
      lang: "python"
  - type: ai_interpret
    name: Evaluate Repository Structure, Supply Chain & Dependencies
    prompt: |
      Review the deterministic ProjectFacts (`runtime_types`, `build_system`, `manifest_files`, `lockfiles_found`, `dependencies`, `unpinned_dependencies`, `has_license`, `has_security_policy`, `has_dependency_automation`, `ci_supply_chain_issues`, `committed_secret_files`, `container_hygiene_issues`, `readme_headings`, `docs_inventory`, `has_gitignore`).
      Verify compliance with `common/supply_chain`, `python/dependencies`, `common/documentation`, `common/git_workflow`, and `common/security`.
