[project]
name = "api"
type = "catalog"
title = "Drawlib API"
description = "Complete Python API and CLI reference for Drawlib — Illustration as Code & Illustrated Documentation as Code."
style = "default"

[i18n]
default_lang = "en"
langs = ["en", "ja"]

[i18n.labels]
en = "English"
ja = "日本語"

[i18n.descriptions]
en = "Complete Python API and CLI reference for Drawlib — every public module, class, function, style token, and CLI subcommand with visual examples."
ja = "Drawlib 公式 Python API・CLI リファレンス — すべての公開モジュール・クラス・関数・スタイルトークン・CLI サブコマンドを図解付きで完全網羅。"

[catalog]
sidebar_expanded = true
breadcrumb_root = { en = "API Reference", ja = "API リファレンス" }
