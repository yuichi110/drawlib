badge_url = "index.html"
repo_url = "https://github.com/yuichi110/drawlib"
header_links = [
    { label = { en = "Docs", ja = "ガイド" }, url = "https://www.drawlib.com/" },
    { label = { en = "Examples", ja = "サンプル集" }, url = "https://examples.drawlib.com/" },
    { label = "Architecture", url = "https://www.drawlib.com/architecture/" },
]

[seo]
site_url = "https://www.drawlib.com/api"
og_image = "_assets/ogp.png"
twitter_card = "summary_large_image"
sitemap = true
