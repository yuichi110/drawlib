[project]
name = "jupyter"
type = "jupyter"
title = "Drawlib Interactive Notebooks"
description = "Interactive Jupyter & Google Colab Hands-on Tutorials — Illustration & Documentation as Code in Pure Python"
style = "google"

[i18n]
default_lang = "en"
langs = ["en", "ja"]

[i18n.labels]
en = "English"
ja = "日本語"

[i18n.descriptions]
en = "6 hands-on Jupyter & Google Colab notebooks covering Drawlib setup(..., cwd=True), 50%+ neutral styling, data charts, SmartArts, cloud architecture diagrams, and auto-layout graphs."
ja = "Drawlib の setup(..., cwd=True)・50%+ ニュートラル配色・データチャート・SmartArts・クラウド構成図・自動グラフレイアウトをブラウザ上で動かして学べる全6章の Jupyter / Google Colab ハンズオンノートブック。"

[jupyter]
drawlib_cell_mode = "markdown"
execute = true
colab_base_url = "https://colab.research.google.com/github/yuichi110/drawlib/blob/main/docs/jupyter"

[seo]
site_url = "https://www.drawlib.com/jupyter"
og_image = "_assets/ogp.png"
twitter_card = "summary_large_image"
sitemap = true
robots = false
llms_txt = true
