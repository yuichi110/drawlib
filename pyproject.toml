[build-system]
requires = ["uv-build<0.12"]
build-backend = "uv_build"

[project]
name = "drawlib"
version = "0.3.0.dev1"
description = "Python drawing library. Illustration as Code."
readme = "README_PYPI.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{name = "Yuichi Ito", email = "yuichi@yuichi.com"}]
dependencies = [
    "matplotlib>=3.8",
    "pydantic>=2.8",
    "pygments>=2.18",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://www.drawlib.com"
Repository = "https://github.com/yuichi110/drawlib"

[project.scripts]
drawlib = "drawlib._tools.cli.main:main"

[project.optional-dependencies]
pdf = [
    "playwright>=1.40.0",
]

[dependency-groups]
dev = [
    "types-pillow>=10.2.0.20240311",
    "ruff>=0.9.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "tomlkit>=0.14.0",
    "ty>=0.0.35",
    "pyright>=1.1.409",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[tool.ruff]
preview = true
fix = true
unsafe-fixes = false
line-length = 120
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "C90", # mccabe 
    "F",   # Pyflakes
    "D",   # pydocstyle
    "E",   # Pycodestyle Error
    "I",   # isort
    "N",   # pep8-naming (N)
    "W",   # Pycodestyle Warning
    "ANN", # flake8-annotations (ANN)
    "CPY", # flake8-copyright
    "S",   # flake8-bandit
    "PL"   # Pylint
]

ignore = [
    "D203",    # 1 blank line required before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D415",    # First line should end with a period, question mark, or exclamation point
    "F401",    # imported but unused
    "PLC0414", # Import alias does not rename original package
    "PLC1901", # compare-to-empty-string
    "PLR0904", # Too many public methods
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0914", # Too many local variables
    "PLR0915", # Too many statements
    "PLR0917", # Too many positional arguments
    "PLR2004", # Magic value used in comparison
    "PLW2901"  # Outer variable overwritten by inner target
]

[tool.ruff.lint.per-file-ignores]
"tools/**.py" = [
    "ANN",     # flake8-annotations
    "S101",    # Use of assert detected
    "S310",    # Audit URL open for permitted schemes
    "S404",    # Subprocess module usage
    "S603",    # Subprocess call without shell=True
    "S607",    # Subprocess with partial executable path
    "PLC2701", # Private name import from external module
    "PLR6301", # Method could be a function/static method
]
"tests*/**.py" = [
    "F403", # undefined-local-with-import-star
    "F405", # undefined-local-with-import-star-usage
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D107", # undocumented-public-init
    "ANN",  # flake8-annotations
    "CPY",  # flake8-copyright
    "S101", # Use of assert detected
    "PLC2701", # Private name import from external module (standard for unit tests)
    "PLR6301" # Method could be a function/static method (standard for pytest classes)
]
"src/drawlib/_tools/doc_builder/**.py" = [
    "S102",    # exec usage is intentional for dynamic code execution
    "S701",    # jinja2 autoescape
    "PLC0415", # lazy import for optional dependencies
    "C901",    # complex build_document
    "F403",    # import star
    "F405"     # import star usage
]
"src/drawlib/_tools/cli/_command.py" = [
    "C901"     # complex command parser
]
"test_build_target/**.py" = [
    "F403", # undefined-local-with-import-star
    "F405", # undefined-local-with-import-star-usage
    "D100", # undocumented-public-module
    "D103", # undocumented-public-function
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src/drawlib", "tools/scripts"]
extraPaths = ["tools/scripts"]
typeCheckingMode = "basic"
reportMissingTypeArgument = "warning"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "image_threshold(threshold): custom pixel match threshold for image comparison",
]
